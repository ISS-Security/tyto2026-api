---
AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: true
  Exclude:
    - _snippets/**/*

plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rake
  - rubocop-sequel

# Chained calls continue one indent step (2 spaces) below the previous line,
# rather than aligning all the way out to the first call point
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Metrics/BlockLength:
  Enabled: true
  Exclude:
    - spec/**/* # Minitest's nested test structure requires large blocks
    - Rakefile # Rake namespaces produce large blocks
    - app/controllers/*.rb # Roda's nested controllers require large blocks

Security/YAMLLoad:
  Enabled: true
  Exclude:
    - spec/**/*

Style/HashSyntax:
  Enabled: true
  Exclude:
    - Rakefile

Style/SymbolArray:
  Enabled: true
  Exclude:
    # - Rakefile
    - db/migrations/*.rb
