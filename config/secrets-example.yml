---
# COPY this file to secrets.yml and modify as needed
development:
  DATABASE_URL: sqlite://db/local/development.db
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  SECURE_SCHEME: HTTP
  ATTENDANCE_RADIUS_M: '55'
  RESEND_API_KEY: <your Resend API key, shown only once at creation>
  RESEND_FROM_EMAIL: <verified sender; onboarding@resend.dev for sandbox>
  RESEND_FROM_NAME: Tyto-Demo
  RESEND_API_URL: https://api.resend.com/emails

test:
  DATABASE_URL: sqlite://db/local/test.db
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  SECURE_SCHEME: HTTP
  ATTENDANCE_RADIUS_M: '55'
  RESEND_API_KEY: stub-key-not-used-in-tests
  RESEND_FROM_EMAIL: noreply@example.com
  RESEND_FROM_NAME: Tyto-Demo
  RESEND_API_URL: https://api.resend.com/emails

production:
  DATABASE_URL: <set to production DB>
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  SECURE_SCHEME: HTTPS
  ATTENDANCE_RADIUS_M: '55'
  RESEND_API_KEY: <your Resend API key, shown only once at creation>
  RESEND_FROM_EMAIL: <verified sender; onboarding@resend.dev for sandbox>
  RESEND_FROM_NAME: Tyto-Demo
  RESEND_API_URL: https://api.resend.com/emails
