---
# COPY this file to secrets.yml and modify as needed
development:
  DATABASE_URL: sqlite://db/local/development.db
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  # Public half of the dev keypair (`rake newkey:signing`); the private
  # SIGNING_KEY half goes to the client app's dev config, never here.
  VERIFY_KEY: <use `rake newkey:signing` to generate a keypair>
  SECURE_SCHEME: HTTP
  ATTENDANCE_RADIUS_M: '55'
  RESEND_API_KEY: <your Resend API key, shown only once at creation>
  RESEND_FROM_EMAIL: <verified sender; onboarding@resend.dev for sandbox>
  RESEND_FROM_NAME: Tyto-Demo
  RESEND_API_URL: https://api.resend.com/emails
  # OAuth client id of a Web-application client; used only to check the
  # id_token `aud`. The API never needs the client secret. See
  # WALKTHROUGH.google-oauth-setup.md (in the baby_tyto planning repo).
  GOOGLE_CLIENT_ID: <Google OAuth client id, type Web application>

test:
  DATABASE_URL: sqlite://db/local/test.db
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  # Dedicated throwaway test keypair (`rake newkey:signing`): specs must
  # forge client signatures, so test -- and only test -- holds both halves.
  # No real client's private key is ever in this repo's config.
  SIGNING_KEY: <use `rake newkey:signing` to generate a keypair>
  VERIFY_KEY: <use `rake newkey:signing` to generate a keypair>
  SECURE_SCHEME: HTTP
  ATTENDANCE_RADIUS_M: '55'
  RESEND_API_KEY: stub-key-not-used-in-tests
  RESEND_FROM_EMAIL: noreply@example.com
  RESEND_FROM_NAME: Tyto-Demo
  RESEND_API_URL: https://api.resend.com/emails
  # Any placeholder works in test: the suite signs its own tokens with a
  # matching `aud` and mocks Google's JWKS endpoint (no real client needed).
  GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com

production:
  DATABASE_URL: <set to production DB>
  DB_KEY: <use `rake newkey:db` to generate a secret key>
  HASH_KEY: <use `rake newkey:hash` to generate a secret key>
  MSG_KEY: <use `rake newkey:msg` to generate a secret key>
  # Public half of the production keypair, generated at deploy time. The
  # matching private SIGNING_KEY lives only in the client app's config --
  # this API can verify but physically cannot sign (non-repudiation).
  VERIFY_KEY: <use `rake newkey:signing` to generate a keypair>
  SECURE_SCHEME: HTTPS
  ATTENDANCE_RADIUS_M: '55'
  RESEND_API_KEY: <your Resend API key, shown only once at creation>
  RESEND_FROM_EMAIL: <verified sender; onboarding@resend.dev for sandbox>
  RESEND_FROM_NAME: Tyto-Demo
  RESEND_API_URL: https://api.resend.com/emails
  GOOGLE_CLIENT_ID: <Google OAuth client id, type Web application>
